# PBX-site edge collector (ADR-0002). Runs on the Raspberry Pi AT a PBX
# site, not on the gateway host — this is a separate deployment from the root
# docker-compose.yaml and the two are never brought up together.
#
# From this directory — `compose.yaml` is a default filename, so no -f needed:
#
#   cd src/pbx/collector
#   cp .env.example .env      # then edit: site, the two serial ports, broker host
#   docker compose up -d --build
#
# Settings live in `.env` beside this file rather than inline on the command
# line. Compose loads it automatically for ${VAR} interpolation, which is a
# different mechanism from the `env_file:` below — see .env.example, which
# explains why both files exist and why swapping them fails silently.
#
# The two ports are easy to swap and the failure is quiet: point node-logd at the
# nRF52840 and every line is rejected, since the two consoles share no grammar.
# Watch lines_rejected on the first counter dump.
#
# Relative paths below resolve against THIS directory, not the repo root, which
# is why context and env_file climb three levels. The Dockerfile path is relative
# to the context, so it stays repo-root-relative.
#
# The `:?` guards apply to `docker compose build` as well, not just `up`: Compose
# interpolates the whole file before it does anything, so `.env` has to be in
# place even for a bare build. They are kept now that the values come from a
# file, because the realistic failure changed rather than went away: no longer a
# forgotten variable on the command line, but a `.env` copied from the example
# and left half-edited. A collector pointed at the wrong device comes up clean
# and reports nothing, so failing loudly is worth the small friction.
#
# The gateway host needs a stable address on the building network for this to
# keep working across reboots — see ADR-0002 § Open questions.

name: meshpbx-collector

services:
  node-logd:
    build:
      context: ../../..
      dockerfile: src/pbx/collector/Dockerfile
    container_name: meshtastic-testbed-node-logd
    restart: unless-stopped
    env_file: ../../../configuration.env   # MQTT_PASSWORD_P1 / MQTT_PASSWORD_P2
    environment:
      - COLLECTOR_SITE=${COLLECTOR_SITE:-p1}
      - NODE_SERIAL_PORT=${NODE_SERIAL_PORT:?set NODE_SERIAL_PORT to the node console, ideally a /dev/serial/by-id path}
      - BROKER_ADDRESS=${BROKER_ADDRESS:?set BROKER_ADDRESS to the gateway host}
      - BROKER_PORT=${BROKER_PORT:-1883}
    devices:
      # Passed through under the same path inside and out, so a by-id path works
      # unchanged in the container.
      - "${NODE_SERIAL_PORT}:${NODE_SERIAL_PORT}"

  # Measurement point P1: the nRF52840's own console. A separate service, not a
  # second thread, because the two ports fail independently and each detects a
  # restart from its own log — a shared process would take both down together.
  pbx-logd:
    build:
      context: ../../..
      dockerfile: src/pbx/collector/Dockerfile
    command: ["python", "src/pbx/collector/pbx_logd.py"]
    container_name: meshtastic-testbed-pbx-logd
    restart: unless-stopped
    env_file: ../../../configuration.env
    environment:
      - COLLECTOR_SITE=${COLLECTOR_SITE:-p1}
      - PBX_SERIAL_PORT=${PBX_SERIAL_PORT:?set PBX_SERIAL_PORT to the nRF52840 J-Link VCOM, ideally a /dev/serial/by-id path}
      - BROKER_ADDRESS=${BROKER_ADDRESS:?set BROKER_ADDRESS to the gateway host}
      - BROKER_PORT=${BROKER_PORT:-1883}
    devices:
      - "${PBX_SERIAL_PORT}:${PBX_SERIAL_PORT}"

# No local Mosquitto bridge, and that is now a deliberate omission rather than a
# gap: the collector is temporary instrumentation, not installed infrastructure
# (ADR-0002, scope correction 2026-08-10). Publishing straight to the gateway's
# broker means a dropped link puts a gap in one measurement run — visible in the
# `lines_seen` counters and re-runnable — instead of permanently losing
# operational data. Add a bridge only for a campaign that has to span a link
# nobody is watching.
