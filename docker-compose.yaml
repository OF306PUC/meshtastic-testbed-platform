services:
  telegraf:
    image: telegraf:1.32-alpine
    container_name: telegraf
    restart: unless-stopped
    env_file: configuration.env
    volumes:
      - ./telegraf/etc/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb
      - mosquitto
    networks:
      - telegraf_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  influxdb:
    image: influxdb:1.11-alpine
    container_name: influxdb
    restart: unless-stopped
    env_file: configuration.env
    ports:
      - '8086:8086'
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - telegraf_network

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: meshtastic-testbed-mqtt-broker
    restart: unless-stopped
    volumes:
      - ./mqtt:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    ports:
      - 1883:1883
      - 9002:9001
    networks:
      - telegraf_network

  gateway-receiver:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    container_name: meshtastic-testbed-gateway
    restart: unless-stopped
    env_file: configuration.env          # MQTT_USERNAME_GATEWAY / _PASSWORD_GATEWAY
    environment:
      - BROKER_ADDRESS=mosquitto           # reach Mosquitto by service name
      - BROKER_PORT=1883
      - CLIENT_ID=meshtastic-testbed-gateway
      # MQTT_USERNAME_GATEWAY / MQTT_PASSWORD_GATEWAY arrive via env_file above.
      # They are NOT listed here on purpose: ${VAR} in this block interpolates
      # from the root .env or the shell, never from env_file, so naming them
      # here would silently pass empty strings.
      - GATEWAY_SERIAL_PORT=${GATEWAY_SERIAL_PORT:-/dev/ttyACM0}
    devices:
      # Pass the USB serial device through to the container. Override the path
      # with `GATEWAY_SERIAL_PORT=/dev/ttyUSB0 docker compose up` if it differs.
      - "${GATEWAY_SERIAL_PORT:-/dev/ttyACM0}:${GATEWAY_SERIAL_PORT:-/dev/ttyACM0}"
    volumes:
      - ./mesh_config.json:/app/mesh_config.json:ro
    depends_on:
      - mosquitto
    networks:
      - telegraf_network

  web:
    build:
      # Repo root, so the image can include src/common alongside monitor/.
      context: .
      dockerfile: monitor/Dockerfile
    container_name: meshtastic-testbed-web
    restart: unless-stopped
    env_file: configuration.env          # DB_USERNAME / DB_PASSWORD
    environment:
      - DB_HOST=influxdb                  # reach InfluxDB by service name
      - DB_PORT=8086
      - DB_NAME=cpsrtc_meshtastic_telemetry
      - BROKER_ADDRESS=mosquitto          # reach Mosquitto by service name
      - BROKER_PORT=1883
      - CLIENT_ID=meshtastic-testbed-monitor
      # MQTT_USERNAME_MONITOR / MQTT_PASSWORD_MONITOR arrive via env_file above.
      - SUBSCRIBE_TOPIC=meshtastic-testbed/+/+
      - MESH_CONFIG_PATH=/app/mesh_config.json
    volumes:
      # Read-only: the dashboard reads the surveyed `position` blocks so the map
      # does not depend on a GPS fix. Same file the gateway reads, mounted at the
      # same path, so there is one source for node identity and geometry.
      - ./mesh_config.json:/app/mesh_config.json:ro
    ports:
      - "5000:5000"
    depends_on:
      - influxdb
      - mosquitto
    networks:
      - telegraf_network

volumes:
  influxdb_data: {}

networks:
  telegraf_network: {}