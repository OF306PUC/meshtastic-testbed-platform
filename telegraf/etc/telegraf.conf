[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = [
    "meshtastic-testbed/+/position",
    "meshtastic-testbed/+/device",
    "meshtastic-testbed/+/environment"
  ]
  qos = 0
  connection_timeout = "30s"
  data_format = "json"
  json_time_key    = "received_at"
  json_time_format = "unix"
  tag_keys = ["node_id", "node_label"]


[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = ["meshtastic-testbed/+/message"]
  qos = 0
  connection_timeout = "30s"
  name_override = "proxy_message"
  data_format = "json"
  json_time_key = "received_at"
  json_time_format = "unix"
  # src_id/dst_id are 4-byte phone ids (decimal uint32), bounded to a handful of
  # handsets per proxy. portnum separates routed unicast (PRIVATE_APP) from
  # broadcast (TEXT_MESSAGE_APP), which has no dst_id at all.
  # pkt_id stays a FIELD on purpose: unique per packet, it would make the series
  # cardinality grow without bound as a tag.
  # channel is a tag here and a plain field on mqtt_consumer: telemetry is always
  # channel 0, but messaging is expected to move from 0 to 1 once the phone app
  # builds the MeshPacket correctly, so this is the query that detects the fix.
  tag_keys = ["node_id", "node_label", "portnum", "channel", "src_id", "dst_id"]

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = ["meshtastic-testbed/+/pdr"]
  qos = 0
  connection_timeout = "30s"
  name_override = "pdr"
  data_format = "json"
  json_time_key = "received_at"
  json_time_format = "unix"
  tag_keys = ["node_label", "flow", "source"]

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "cpsrtc_meshtastic_telemetry"
  # Credentials interpolated from the telegraf container's environment
  # (injected via env_file: configuration.env in docker-compose.yaml).
  username = "${INFLUXDB_ADMIN_USER}"
  password = "${INFLUXDB_ADMIN_PASSWORD}"
  retention_policy = ""
  write_consistency = "any"
  timeout = "5s"