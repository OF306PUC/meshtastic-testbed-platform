[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = [
    "meshtastic-testbed/+/position",
    "meshtastic-testbed/+/device",
    "meshtastic-testbed/+/environment"
  ]
  qos = 0
  connection_timeout = "30s"
  name_override = "telemetry"
  data_format = "json"
  json_time_key    = "received_at"
  json_time_format = "unix"
  tag_keys = ["node_id", "node_label"]


[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = ["meshtastic-testbed/+/message"]
  qos = 0
  connection_timeout = "30s"
  name_override = "pbx_message"
  data_format = "json"
  json_time_key = "received_at"
  json_time_format = "unix"
  tag_keys = ["node_id", "node_label", "portnum", "channel", "src_id", "dst_id"]

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = ["meshtastic-testbed/+/pdr"]
  qos = 0
  connection_timeout = "30s"
  name_override = "pdr"
  data_format = "json"
  json_time_key = "received_at"
  json_time_format = "unix"
  tag_keys = ["node_label", "flow", "source"]

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = ["meshtastic-testbed/+/pbx"]
  qos = 0
  connection_timeout = "30s"
  name_override = "pbx_health"
  data_format = "json"
  json_time_key = "received_at"
  json_time_format = "unix"
  # Both collectors at a site publish here, so this measurement carries two
  # schemas discriminated by `kind`:
  #   node-logd  kind=tx        portnum, channel, outcome   (one per packet)
  #              kind=counters  txGood/rxGood and parser health
  #   pbx-logd   kind=counters  cumulative PBX counters
  #              kind=phone     per-handset delivery, tagged by phone
  #              kind=event     register / connect / disconnect / reboot / loss
  #              kind=frame     per-frame identities, direction up|dn
  #
  # A record carries only the tags its kind defines; the rest come back empty,
  # which is expected rather than missing data. All of these are bounded — at
  # most a handful of phones per site — whereas pkt_id is unique per packet and
  # stays a FIELD, as it does on pbx_message.
  tag_keys = ["node_label", "kind", "portnum", "channel", "outcome",
              "phone", "direction", "event", "src_id", "dst_id"]

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "cpsrtc_meshtastic_telemetry"
  # Credentials interpolated from the telegraf container's environment
  # (injected via env_file: configuration.env in docker-compose.yaml).
  username = "${INFLUXDB_ADMIN_USER}"
  password = "${INFLUXDB_ADMIN_PASSWORD}"
  retention_policy = ""
  write_consistency = "any"
  timeout = "5s"