# TCP listener
listener 1883

# WebSocket listener
listener 9001
protocol websockets

# Persistence
persistence true
persistence_file mosquitto.db
persistence_location /mosquitto/data/

# Authentication
#
# Anonymous access was harmless while the whole stack ran on one machine. It
# stops being harmless the moment a PBX-site collector publishes over the
# building WiFi (ADR-0002): the broker then accepts writes from anyone on a
# shared network. For a measurement testbed that is a DATA INTEGRITY problem
# before it is a security one — injected telemetry is indistinguishable from
# real data afterwards, and the receiver cannot filter it out, because
# _is_valid() checks a node_id carried INSIDE the payload the writer controls.
#
# pwfile is not in git. Generate it with ./mqtt/init-credentials.sh BEFORE the
# next `docker compose up`, or every client is refused with rc=5 and the
# pipeline goes silent without an obvious cause.
allow_anonymous false
password_file /mosquitto/config/pwfile
acl_file /mosquitto/config/aclfile
